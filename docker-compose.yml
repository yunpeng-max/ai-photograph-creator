version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_photo
      POSTGRES_USER: ai_photo
      POSTGRES_PASSWORD: ai_photo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_photo:ai_photo@db:5432/ai_photo
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-random-32-char-string}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      ALLOWED_ORIGINS: http://localhost,http://localhost:80
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
